<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden Guardian · Mobile Prototype</title><style>
:root{--leaf:#416936;--soft:#f7f9f2;--muted:#788773;--line:#dfe9d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f1e5,#f4e6db 54%,#e6eef1);font-family:Manrope,"Noto Sans SC",sans-serif;color:#2f472a}.phone{width:min(420px,100vw);height:min(860px,100vh);padding:8px;border-radius:45px;background:#253329;box-shadow:0 25px 70px #304d372e}.screen{position:relative;height:100%;overflow:hidden;border-radius:37px;background:var(--soft)}.bar{display:flex;justify-content:space-between;padding:14px 18px 4px;font-size:10px;font-weight:800}.head{display:flex;justify-content:space-between;padding:13px 19px}.head small{display:block;color:var(--muted);font-size:10px;font-weight:800}.head h1{margin:4px 0 0;font-size:19px;letter-spacing:-.06em}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#dceccb;font-size:12px;font-weight:800}.content{height:calc(100% - 113px);overflow:auto;padding:0 15px 90px}.weather,.task,.diag,.row{border-radius:21px;padding:15px}.weather{display:flex;justify-content:space-between;align-items:center;background:#e4f0dc}.weather small,.weather span{display:block;color:#64825b;font-size:9px}.weather b{display:block;margin-top:2px;font-size:31px;letter-spacing:-.08em}.weather em{font-size:25px;font-style:normal}.task{margin-top:10px;color:#fff;background:var(--leaf);box-shadow:0 10px 22px #4169362e}.task span{color:#d9eacb;font-size:9px;font-weight:800}.task h2{margin:8px 0 5px;font-size:17px;letter-spacing:-.04em}.task p{margin:0;color:#d9eacb;font-size:10px;line-height:1.5}.task button,.diag button{margin-top:11px;min-height:29px;border:0;border-radius:10px;padding:0 11px;color:#304a27;background:#edffc9;font-size:10px;font-weight:800}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}.section b{font-size:12px}.section span{color:#6d8965;font-size:9px;font-weight:800}.crops{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.crop{display:grid;justify-items:center;gap:3px;padding:11px 4px;border:1px solid var(--line);border-radius:16px;background:#fff}.crop strong{font-size:10px}.crop small{color:#8b9785;font-size:8px}.diag{margin-top:11px;background:#e9f3e5}.diag b{font-size:11px}.diag p{margin:5px 0 0;color:#6b8067;font-size:10px;line-height:1.55}.diag button{background:#fff;color:#416936;border:1px solid #c9dbc0}.nav{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(3,1fr);height:67px;padding:11px 19px 9px;border-top:1px solid var(--line);background:#fffdf8e8;backdrop-filter:blur(16px)}.nav span{display:grid;justify-items:center;gap:2px;color:#9aaa95;font-size:18px}.nav span.on{color:var(--leaf)}.nav b{font-size:9px}.toast{position:absolute;right:16px;bottom:80px;left:16px;padding:11px;border-radius:13px;color:#fff;background:#2f472a;text-align:center;font-size:10px;font-weight:700;opacity:0;transform:translateY(8px);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-height:700px){.phone{height:100vh;border-radius:0;padding:0}.screen{border-radius:0}}
</style></head><body><div class="phone"><div class="screen"><div class="bar"><span>9:41</span><span>● ●● ▰</span></div><div class="head"><div><small>姥姥的菜园</small><h1>早上好，今天先做 1 件事</h1></div><div class="avatar">姥</div></div><div class="content"><div class="weather"><div><small>沈阳 · 晴</small><b>24°</b><span>今晚可能降温</span></div><em>☀</em></div><div class="task"><span>今日最重要</span><h2>傍晚给番茄补一次水</h2><p>白天温度较高，等太阳变弱后再浇。先摸一下土，干到一指深再浇。</p><button id="done">我知道了</button></div><div class="section"><b>我的菜</b><span>查看全部</span></div><div class="crops"><div class="crop"><span>🍅</span><strong>番茄</strong><small>需要关注</small></div><div class="crop"><span>🥒</span><strong>黄瓜</strong><small>长势稳定</small></div><div class="crop"><span>🥬</span><strong>生菜</strong><small>可以采收</small></div></div><div class="section"><b>问一问</b><span>拍照诊断</span></div><div class="diag"><b>叶子上出现了小白点？</b><p>先拍整株和叶片，系统会先做客观观察，再调度病理、昆虫或栽培专家。</p><button id="ask">开始诊断</button></div></div><div class="nav"><span class="on">⌂<b>今天</b></span><span>◎<b>问一问</b></span><span>♧<b>菜园</b></span></div><div class="toast" id="toast">已记录，今天的第一件事完成啦 ✓</div></div></div><script>const toast=document.querySelector('#toast');document.querySelector('#done').onclick=()=>{toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)};document.querySelector('#ask').onclick=()=>{toast.textContent='已打开拍照诊断 · 先说清楚你看到的变化';toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');toast.textContent='已记录，今天的第一件事完成啦 ✓'},2400)};</script></body></html>
